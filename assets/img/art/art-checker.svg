<title id="t2">A checker looking closely at pixels</title>
<desc id="d2">A magnifying glass with a coral ring is held over a small picture frame made of pixels. Behind it, two faint dashed sheets suggest extra evidence that is only sometimes available: one with lines of code and one with a ribbon seal.</desc>
